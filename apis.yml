aid: realtyfeed

name: RealtyFeed

description: RealtyFeed, a Realtyna company, is a real estate data platform that distributes MLS listing data to brokers,
  agents, IDX website builders and data vendors. Its MLS Router API is a RESO-certified Web API (OData) at api.realtyfeed.com,
  authenticated with OAuth2 client credentials issued through the RealtyFeed Dashboard (data vendors get access through a
  separate invitation-only dashboard). It serves Property, Member, Office, OpenHouse, PropertyRooms, Media, metadata and lookup
  resources in either RESO or RealtyFeed output, plus geo and history endpoints, and publishes documentation (authentication,
  searchable fields, error handling, rate limits, changelog) and a public Postman collection. RealtyFeed also offers MLS On
  The Fly IDX widgets.

